# ==============================================================================
# WAR KONSUMSI — NGINX PRODUCTION CONFIGURATION WITH PUBLIC IP HTTPS (TLS)
# ==============================================================================
# Architecture:
# - Serves directly via Public Server IP over HTTPS (No custom domain required).
# - Uses Let's Encrypt Public IP address certificate (Certbot short-lived profile).
# - Automatic HTTP (Port 80) to HTTPS (Port 443) permanent redirection.
# - Clean URL mapping:
#     https://<PUBLIC_IP>/          -> Next.js Mobile-First Participant Flow
#     https://<PUBLIC_IP>/admin     -> Next.js Admin Operations Portal
#     https://<PUBLIC_IP>/api/      -> NestJS High-Throughput REST API
#     https://<PUBLIC_IP>/socket.io/-> NestJS WSS Realtime Gateway
# ==============================================================================
# IP CERTIFICATE PROVISIONING GUIDE:
# 1. Ensure Certbot 5.4+ is installed on the VPS.
# 2. Webroot ACME verification command:
#      sudo certbot certonly --webroot -w /var/www/certbot \
#        -d <YOUR_PUBLIC_IP> --agree-tos -m admin@example.com --non-interactive
#    Alternatively using standalone (temporarily stop Nginx):
#      sudo certbot certonly --standalone -d <YOUR_PUBLIC_IP>
# 3. Setup automatic renewal with Nginx reload hook:
#      echo "0 0 * * * root certbot renew --deploy-hook 'systemctl reload nginx'" | sudo tee /etc/cron.d/certbot-ip-renew
# 4. Copy this file to /etc/nginx/sites-available/war-konsumsi
#    sudo ln -s /etc/nginx/sites-available/war-konsumsi /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Gzip Compression for Fast Mobile UX
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

# Upstream Server Pools (Bound strictly to localhost 127.0.0.1)
upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream backend_upstream {
    server 127.0.0.1:4000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# Rate Limiting Zones (Concurrency-Aware Protection)
# ------------------------------------------------------------------------------
# 1. Admin login protection: Prevent brute-force password guessing (5 requests/minute per IP)
limit_req_zone $binary_remote_addr zone=admin_login_zone:10m rate=5r/m;

# 2. Participant registration protection: Throttles registration floods (20 requests/second per IP)
limit_req_zone $binary_remote_addr zone=participant_join_zone:10m rate=20r/s;

# NOTE: The critical war selection endpoint (/api/participants/.../selection) is
# INTENTIONALLY NOT RATE-LIMITED to allow legitimate 500+ req/s burst selection at 00.00.00.

# ==============================================================================
# 1. HTTP Server (Port 80) — Redirect to HTTPS & ACME Challenge
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME Challenge for Let's Encrypt HTTP-01 IP verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. HTTPS Server (Port 443) — TLS Termination with Public IP Certificate
# ==============================================================================
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Certificate Paths (Replace <YOUR_PUBLIC_IP> with actual VPS Public IP)
    ssl_certificate /etc/letsencrypt/live/YOUR_PUBLIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_PUBLIC_IP/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Maximum payload size for participant exports / CSV
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # Production Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self';" always;

    # --------------------------------------------------------------------------
    # Route 1: Admin Login Endpoint (Protected by Brute-Force Rate Limiting)
    # --------------------------------------------------------------------------
    location /api/admin/auth/login {
        limit_req zone=admin_login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_upstream/api/admin/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # Route 2: Participant Join Endpoint (Protected by Abuse Rate Limiting)
    # --------------------------------------------------------------------------
    location ~* ^/api/events/[^/]+/join$ {
        limit_req zone=participant_join_zone burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # Route 3: Participant War Selection (EXPLICITLY UNTHROTTLED BURST SELECTION)
    # --------------------------------------------------------------------------
    # Concurrency Invariant: The PostgreSQL atomic transaction enforces quota
    # integrity. Nginx MUST NOT artificially drop legitimate concurrent clicks.
    location ~* ^/api/events/[^/]+/selections$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # Route 4: General NestJS REST API (/api/)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Route 5: Realtime WebSocket / Socket.IO WSS (/socket.io/)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend_upstream/socket.io/;
        proxy_http_version 1.1;

        # WebSocket Upgrade Protocol
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket buffering & long-polling timeouts
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Route 6: Next.js Static Asset Caching (/_next/static/)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_upstream/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache immutable Next.js build assets
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # Route 7: Next.js Frontend Application (Mobile-First Web & Admin Portal)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
