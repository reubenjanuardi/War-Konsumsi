# ==============================================================================
# WAR KONSUMSI — PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# NOTE: In production, PostgreSQL runs natively on the VPS per PRD and architecture.md.
# Containers connect to native PostgreSQL via host.docker.internal (or host network).
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # NestJS Backend API & Realtime Gateway
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: war_konsumsi_api_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
    extra_hosts:
      # Allows container to reach native PostgreSQL running on host VPS
      - "host.docker.internal:host-gateway"
    networks:
      - war_internal_net

  # ----------------------------------------------------------------------------
  # Next.js Frontend Application
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: war_konsumsi_web_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - war_internal_net

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy Ingress (Only public entrypoint)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: war_konsumsi_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - war_internal_net

networks:
  war_internal_net:
    driver: bridge
